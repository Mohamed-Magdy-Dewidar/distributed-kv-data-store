syntax = "proto3";

package kvstore;

option go_package = "distributed-kv-datastore/internal/rpc/pb";

message DataItem {
  bytes value = 1;
  map<string, uint32> vector_clock = 2;
  string last_updated_by = 3;
  bool is_deleted = 4;
}

message ReplicateRequest {
  string key = 1;
  repeated DataItem items = 2;                                 
}

message ReplicateResponse {
  bool accepted = 1;
}

message FetchItemRequest {
  string key = 1;
}

message FetchItemResponse {
  repeated DataItem items = 1;
  bool found = 2;
}

message GetMerkleTreeRequest {
  int32 num_buckets = 1;
}

message GetMerkleTreeResponse {
  int32 num_buckets = 1;
  repeated bytes nodes = 2; 
                             
}

message GetBucketKeysRequest {
  int32 bucket_index = 1;
  int32 num_buckets = 2;
}

message GetBucketKeysResponse {
  repeated string keys = 1;
}

// VectorContext wraps a client's causal context so its absence is visible
// on the wire: a nil context ("build on whatever versions exist") and an
// empty one ("build on nothing") mean different things to Store.Put, and a
// bare proto3 map can't tell them apart.
message VectorContext {
  map<string, uint32> entries = 1;
}

// CoordinatePutRequest carries a raw client write — value and causal
// context exactly as the client supplied them, no vector clock built yet —
// from a node that isn't one of key's replicas to one that is.
message CoordinatePutRequest {
  string key = 1;
  bytes value = 2;           // JSON, same encoding as DataItem.value
  VectorContext context = 3; // unset = nil context
}

message CoordinatePutResponse {}

// Ping is the heartbeat. The sender announces its own ID, its address (so a
// receiver that does not list it yet can fetch its membership), and the
// membership epoch and fingerprint it holds.
message PingRequest {
  string sender_id = 1;
  string sender_address = 2;
  uint64 epoch = 3;
  string fingerprint = 4;
}

// PingResponse names the answering node, so a caller can tell it reached the
// node it meant to, and its membership epoch and fingerprint.
message PingResponse {
  string node_id = 1;
  uint64 epoch = 2;
  string fingerprint = 3;
}

message GetMembershipRequest {}

// GetMembershipResponse is the answering node's current membership. The
// fingerprint is a claim: a receiver recomputes it from the members.
message GetMembershipResponse {
  uint64 epoch = 1;
  map<string, string> members = 2; // node ID -> address
  string fingerprint = 3;
}

service KVReplication {
  rpc Replicate(ReplicateRequest) returns (ReplicateResponse);
  rpc FetchItem(FetchItemRequest) returns (FetchItemResponse);
  rpc GetMerkleTree(GetMerkleTreeRequest) returns (GetMerkleTreeResponse);
  rpc GetBucketKeys(GetBucketKeysRequest) returns (GetBucketKeysResponse);
  // CoordinatePut asks a replica to coordinate a client write: version it
  // once on itself, replicate it, and report whether W was reached.
  rpc CoordinatePut(CoordinatePutRequest) returns (CoordinatePutResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GetMembership(GetMembershipRequest) returns (GetMembershipResponse);
}