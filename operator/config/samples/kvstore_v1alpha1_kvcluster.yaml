apiVersion: kvstore.dewidar.dev/v1alpha1
kind: KVCluster
metadata:
  labels:
    app.kubernetes.io/name: kvstore-operator
    app.kubernetes.io/managed-by: kustomize
  name: kv
spec:
  # The 10-node cluster of deploy/k8s/: replication, storage, resources and
  # drainTimeout are left at their defaults (n=3 w=2 r=2, 1Gi, the measured
  # requests and limits, 30m).
  replicas: 10
  image: kvnode:dev
